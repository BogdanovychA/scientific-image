# Конфігурація для Python-хуків збірки сайту

# Алфавіти для сортування покажчика
alphabets:
  ukrainian: "абвгґдеєжзиіїйклмнопрстуфхцчшщьюя"
  latin: "abcdefghijklmnopqrstuvwxyz"

# Назви розділів навігації
navigation:
  home_title: "Головна"
  articles_title: "Статті"
  sources_title: "Джерела"
  about_title: "Про проєкт"
  about_page_path: "pages/about/"
  accessibility_title: "Доступність"
  accessibility_page_path: "pages/accessibility/"

# Безпека (/.well-known/security.txt за стандартом RFC 9116)
security:
  contact: "mailto:ciso@bogdanovych.org"
  languages: "uk, en"

# Шаблони форматування алфавітного покажчика
templates:
  letter_section: '<h3 id="letter-{letter}" class="alpha-section">{letter}</h3>'
  list_item_with_desc: '- <span class="article-title">[{label}]({target})</span><span class="article-desc">{desc}</span>'
  list_item_no_desc: '- <span class="article-title">[{label}]({target})</span>'
  alpha_nav_wrapper: '<nav class="alpha-nav" aria-label="Алфавітний покажчик">{links}</nav>'
  alpha_nav_link: '<a href="#letter-{letter}" class="alpha-nav-link" aria-label="Літера {letter}">{letter}</a>'
